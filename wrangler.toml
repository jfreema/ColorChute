name = "colorchute"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# The built site. Only /api/ runs the Worker; everything else is served straight from here.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Accounts, approvals and saved designs (free plan). Secrets: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ADMIN_EMAILS.
[[d1_databases]]
binding = "DB"
database_name = "colorchute"
database_id = "5a3c5402-2c0c-4945-b8e7-f04e0894296e"
